[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timew-api"
version = "0.1.0"
description = "HTTP API and web page for timewarrior, behind Cloudflare Access"
requires-python = ">=3.11"
dependencies = ["cryptography"]

[project.scripts]
timew-api = "timew_api.server:main"

[tool.setuptools]
packages = ["timew_api"]

[tool.setuptools.package-data]
timew_api = ["static/*.html"]
